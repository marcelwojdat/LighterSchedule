services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lighterschedule_db
      POSTGRES_USER: ls_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ls_app -d lighterschedule_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Production runs images built by the release workflow; deploy.sh sets APP_VERSION to the release tag.
  # "local" is never pushed, so a forgotten APP_VERSION fails on pull instead of starting some other version.
  # `docker compose build` still builds both images locally.
  web:
    image: ghcr.io/marcelwojdat/lighterschedule-web:${APP_VERSION:-local}
    build:
      context: .
      target: backend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      DB_NAME: lighterschedule_db
      DB_USER: ls_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_HOST: db
      DB_PORT: "5432"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    # Only nginx on this host may reach the app. A bare "8000:8000" listens on every interface,
    # and Docker's iptables rules bypass UFW, so the API would be open without HTTPS.
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    image: ghcr.io/marcelwojdat/lighterschedule-frontend:${APP_VERSION:-local}
    build:
      context: .
      target: frontend-runtime
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
