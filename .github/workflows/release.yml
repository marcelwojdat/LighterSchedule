name: Release

# On every push to main, release-please keeps a "release PR" (version bump + CHANGELOG) up to date.
# Merging that PR tags vX.Y.Z; in the same run the tagged commit is tested, built into two images
# on GHCR and, once approved in the "production" environment, deployed by deploy/deploy.sh.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    concurrency:
      group: release-please
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      # Third-party actions are pinned to a commit: a tag like @v5 can be moved to other code.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  test:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  images:
    needs: [release-please, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: backend
            image: lighterschedule-web
          - target: frontend-runtime
            image: lighterschedule-frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: APP_VERSION=${{ needs.release-please.outputs.tag }}
          # Only the release tag, never "latest": the server always asks for an exact version.
          tags: ghcr.io/marcelwojdat/${{ matrix.image }}:${{ needs.release-please.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  deploy:
    needs: [release-please, images]
    runs-on: ubuntu-latest
    # Required reviewers on this environment make the job wait for a manual approval;
    # the DEPLOY_* secrets are environment secrets, readable only after that approval.
    environment:
      name: production
      url: https://prostygrafik.com
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions: {}
    steps:
      # Plain ssh, no third-party action: this job holds the server key.
      # The server restricts this key to deploy/deploy.sh, which reads the tag sent as the command.
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "$DEPLOY_TARGET" "$TAG"
