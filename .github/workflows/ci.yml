name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lighterschedule_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Same versions and settings as local development (see .env.example).
      DJANGO_DEBUG: 'True'
      DJANGO_SECRET_KEY: ci-only-secret
      DB_PASSWORD: ci-password
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test core

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lighterschedule_front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lighterschedule_front/package-lock.json
      - run: npm ci
      - name: Tests
        run: npm test -- --watchAll=false
      - name: Production build (lint warnings fail the build)
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image builds
        run: docker build --tag prostygrafik:ci .
